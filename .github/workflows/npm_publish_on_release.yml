# Runs tests, then publishes the package to npmjs when a release is created.
# Auth via npm trusted publishing (OIDC) — no token needed.
# See: https://docs.npmjs.com/trusted-publishers

name: Publish

on:
  release:
    types: [created]

jobs:
  build:
    uses: ./.github/workflows/build_test.yml

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@latest
      - name: Setup Yarn package manager
        run: |
          corepack enable
          yarn install --immutable
      - run: yarn build
      - run: npm publish --access public
